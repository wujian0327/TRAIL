{
  "suite": "frozen_v1_sustained_outage_pilot_v2",
  "protocol_version": "frozen-v1",
  "build_command": ["cargo", "build", "--release"],
  "binary": "target/release/trail",
  "max_parallel": 4,
  "timeout_seconds": 3600,
  "seeds": [0, 1, 2, 3, 4],
  "defaults": {
    "run_revision": "sustained-outage-v3-subthreshold-ba",
    "node_num": 100,
    "sybil_node_num": 0,
    "fake_node_num": 0,
    "unstable_node_num": 0,
    "topology": "ba",
    "tx_rate": 64,
    "stake_gini": 0.1,
    "transaction_fee": 0.001,
    "base_reward": 0.1,
    "slot_duration": 1,
    "slot_per_epoch": 5,
    "max_tx_per_block": 128,
    "time_scale": 0.05,
    "trail_target_depth": 4,
    "beta": 0.8,
    "trail_saturation_k": 1.0,
    "trail_score_cost_reference": 0.00001,
    "trail_score_floor_kappa": 1.0,
    "trail_bonus_zeta": 1.0,
    "eta": 0.5,
    "bonus_cap": 1.0,
    "proposer_fee_ratio": 0.5,
    "reward_settlement_depth": 2,
    "trail_score_activation_delay_epochs": 2,
    "trail_max_path_hops": 16,
    "trail_evidence_work_limit": 4096,
    "trail_challenge_work_limit": 1024,
    "relay_profile": "active"
  },
  "outage": {
    "warmup_epochs": 30,
    "duration_epochs": 100,
    "stake_fractions": [0.10, 0.20, 0.30],
    "selections": ["random"],
    "calibration_protocol": "trail",
    "protocols": ["trail_eta0", "trail"]
  }
}
